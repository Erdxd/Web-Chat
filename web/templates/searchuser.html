<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Поиск пользователя</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }
        body {
            height: 100vh;
            background: linear-gradient(145deg, #0f0c1e 0%, #1a1535 50%, #251c45 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: rgba(20, 15, 40, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 30px;
            width: 420px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(180, 130, 255, 0.2);
            color: white;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #7c4dff, #b47aff);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            font-weight: 600;
        }
        h2 {
            font-weight: 500;
            color: #f0eaff;
            margin-bottom: 4px;
        }
        .tag {
            color: #b9a6e0;
            font-size: 15px;
            margin-bottom: 4px;
        }
        .status {
            font-size: 14px;
            margin-bottom: 20px;
        }
        .online {
            color: #4ade80;
        }
        .offline {
            color: #8877b9;
        }
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 12px;
            border: none;
            text-align: center;
        }
        .btn-primary {
            background: #7c4dff;
            color: white;
        }
        .btn-primary:hover {
            background: #936eff;
        }
        .btn-back {
            background: transparent;
            border: 1px solid rgba(124, 77, 255, 0.4);
            color: #cbb5ff;
        }
        .btn-back:hover {
            background: rgba(124, 77, 255, 0.1);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">{{printf "%.1s" .User.Name}}</div>
        <h2>{{.User.Name}}</h2>
        <p class="tag">@{{.User.UserTag}}</p>
        <p class="status">{{if .Online}}<span class="online">🟢 Онлайн</span>{{else}}<span class="offline">🟡 Оффлайн</span>{{end}}</p>
        <a href="/chats/private?user_id={{.User.UserId}}" class="btn btn-primary">💬 Написать</a>
        <a href="/" class="btn btn-back">← Назад в чат</a>
    </div>
</body>
</html>
