<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Чат</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(145deg, #0f0c1e, #1a1535);
            color: white;
            min-height: 100vh;
        }
        #chat {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(20, 15, 40, 0.7);
            border-radius: 20px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }
        .msg {
            margin: 8px 0;
            padding: 10px 16px;
            border-radius: 20px;
            max-width: 70%;
            background: rgba(45, 30, 75, 0.8);
            border: 1px solid rgba(200, 160, 255, 0.25);
        }
        .meta {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        .input-area {
            max-width: 800px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }
        input {
            flex: 1;
            padding: 14px;
            border-radius: 40px;
            border: none;
            background: rgba(20, 12, 40, 0.8);
            color: white;
            border: 1px solid #7c4dff;
        }
        button {
            padding: 14px 24px;
            border-radius: 40px;
            border: none;
            background: #7c4dff;
            color: white;
            cursor: pointer;
        }
        .room-bar {
            max-width: 800px;
            margin: 20px auto;
            display: flex;
            gap: 10px;
        }
        .room-btn {
            padding: 8px 20px;
            background: rgba(124, 77, 255, 0.3);
            border: 1px solid #7c4dff;
            color: white;
            border-radius: 40px;
            cursor: pointer;
        }
        .room-btn.active {
            background: #7c4dff;
        }
    </style>
</head>
<body>

<div class="room-bar">
    <button class="room-btn active" data-room="1">Комната 1</button>
    <button class="room-btn" data-room="2">Комната 2</button>
    <button class="room-btn" data-room="3">Комната 3</button>
</div>

<div id="chat"></div>

<div class="input-area">
    <input type="text" id="input" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') send()">
    <button onclick="send()">Отправить</button>
</div>

<script>
    let socket;
    let currentRoom = 1;
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');

    function connect(room) {
        if (socket) socket.close();
        socket = new WebSocket(`ws://${location.host}/ws?room=${room}`);

        socket.onmessage = (e) => {
            const data = JSON.parse(e.data);
            if (data.type === 'message') {
                const div = document.createElement('div');
                div.className = 'msg';
                
                const name = data.name || `User ${data.userid}`;
                const time = new Date(data.createdAt).toLocaleTimeString().slice(0,5);
                
                div.innerHTML = `
                    <div class="meta">${name} · ${time}</div>
                    <div>${data.content}</div>
                `;
                chat.appendChild(div);
                chat.scrollTop = chat.scrollHeight;
            }
        };
    }

    function send() {
        const text = input.value.trim();
        if (!text || !socket) return;
        socket.send(JSON.stringify({ text }));
        input.value = '';
    }

    document.querySelectorAll('.room-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelectorAll('.room-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentRoom = +btn.dataset.room;
            chat.innerHTML = '';
            connect(currentRoom);
        };
    });

    connect(1);
</script>
</body>
</html>
