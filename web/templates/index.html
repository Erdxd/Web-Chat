<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Чат</title>
<style>
body {
    font-family: sans-serif;
    margin: 0;
}
.container {
    display: flex;
    height: 100vh;
}
.sidebar {
    width: 220px;
    border-right: 1px solid #ddd;
    padding: 10px;
}
.room {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 6px;
    cursor: pointer;
}
.room:hover {
    background: #f0f0f0;
}
.avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #ccc;
}
.chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
}
.header {
    padding: 10px;
    border-bottom: 1px solid #ddd;
    font-weight: 600;
}
#chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
}
.msg {
    max-width: 65%;
    margin: 4px 0;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 14px;
    word-wrap: break-word;
}
.me {
    align-self: flex-end;
    background: #e3f2fd;
    border: 1px solid #90caf9;
}
.other {
    align-self: flex-start;
    background: #f5f5f5;
    border: 1px solid #ddd;
}
.input-area {
    display: flex;
    border-top: 1px solid #ddd;
}
.input-area input {
    flex: 1;
    padding: 10px;
    border: none;
    outline: none;
}
.input-area button {
    padding: 10px 14px;
    border: none;
    cursor: pointer;
    background: none;
}
</style>
</head>
<body>
<div class="container">
    <div class="sidebar">
        <div class="room">
            <div class="avatar"></div>
            <span>Комната 1</span>
        </div>
        <div class="room">
            <div class="avatar"></div>
            <span>Комната 2</span>
        </div>
        <div class="room">
            <div class="avatar"></div>
            <span>Комната 3</span>
        </div>
    </div>
    <div class="chat-area">
        <div class="header">
            Чат: <span id="currentRoom">1</span>
        </div>
        <div id="chat"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('messageInput');
const currentRoomSpan = document.getElementById('currentRoom');

let currentRoom = 1;
let myUserId = null;
let socket;

// Функция для получения своего userId из куки (JWT)
function getMyUserId() {
    const cookies = document.cookie.split('; ');
    const tokenCookie = cookies.find(c => c.startsWith('token='));
    if (!tokenCookie) return null;
    const token = tokenCookie.split('=')[1];
    try {
        const payload = JSON.parse(atob(token.split('.')[1]));
        return payload.User_id;
    } catch (e) {
        return null;
    }
}

function connectToRoom(room) {
    if (socket) {
        socket.close();
    }
    
    socket = new WebSocket(`ws://localhost:8080/ws?room=${room}`);
    
    socket.onopen = () => {
        console.log('WebSocket connected to room', room);
        myUserId = getMyUserId();
    };
    
    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        
        if (data.type === 'message') {
            const msgDiv = document.createElement('div');
            // Сравниваем userId из сообщения с моим userId
            msgDiv.className = data.userId === myUserId ? 'msg me' : 'msg other';
            msgDiv.innerText = data.content;
            msgDiv.dataset.messageId = data.id;
            chat.appendChild(msgDiv);
            chat.scrollTop = chat.scrollHeight;
        } else if (data.type === 'delete') {
            const msgElement = document.querySelector(`[data-message-id="${data.id}"]`);
            if (msgElement) msgElement.remove();
        }
    };
    
    socket.onerror = (err) => console.error('WebSocket error:', err);
    socket.onclose = () => console.log('WebSocket closed');
}

function selectRoom(room) {
    currentRoom = room;
    currentRoomSpan.innerText = room;
    chat.innerHTML = '';
    connectToRoom(room);
}

function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    if (!socket || socket.readyState !== WebSocket.OPEN) {
        console.error('Socket not connected');
        return;
    }
    socket.send(JSON.stringify({ text: text }));
    input.value = '';
}

// Привязываем клики к комнатам
document.querySelectorAll('.room').forEach((el, index) => {
    el.onclick = () => selectRoom(index + 1);
});

// Получаем свой userId при загрузкеф
myUserId = getMyUserId();
console.log('My userId:', myUserId);

// Подключаемся к комнате 1
connectToRoom(1);
</script>
</body>
</html>
