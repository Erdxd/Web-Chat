<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Inter', system-ui, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(145deg, #0f0c1e 0%, #1a1535 50%, #251c45 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .profile-container {
            width: 500px;
            max-width: 100%;
            background: rgba(20, 15, 40, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(180, 130, 255, 0.2);
            color: white;
        }

        .back-link {
            display: inline-block;
            color: #b9a6e0;
            text-decoration: none;
            margin-bottom: 30px;
            font-size: 15px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #d4c5ff;
        }

        h2 {
            font-weight: 500;
            font-size: 26px;
            margin-bottom: 8px;
            color: #f0eaff;
        }

        .subtitle {
            color: #8877b9;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .info-card {
            background: rgba(30, 20, 55, 0.6);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 24px;
            border: 1px solid rgba(160, 120, 255, 0.2);
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            color: #8877b9;
            font-size: 13px;
        }

        .info-value {
            color: #e4d9ff;
            font-size: 15px;
            font-weight: 500;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 40px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            text-align: center;
            transition: 0.2s;
            margin-bottom: 12px;
            text-decoration: none;
        }

        .btn-primary {
            background: #7c4dff;
            color: white;
        }

        .btn-primary:hover {
            background: #936eff;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid rgba(124, 77, 255, 0.5);
            color: #cbb5ff;
        }

        .btn-outline:hover {
            background: rgba(124, 77, 255, 0.15);
        }

        .btn-danger {
            background: transparent;
            border: 1px solid rgba(255, 120, 120, 0.4);
            color: #ffb0b0;
        }

        .btn-danger:hover {
            background: rgba(255, 90, 90, 0.15);
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            color: #b9a6e0;
            font-size: 13px;
            font-weight: 500;
        }

        input {
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid rgba(124, 77, 255, 0.4);
            background: rgba(20, 12, 40, 0.7);
            color: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #a78bfa;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(20, 15, 40, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 30px;
            width: 420px;
            max-width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(180, 130, 255, 0.2);
        }

        .modal-content h3 {
            color: #f0eaff;
            font-weight: 500;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="profile-container" id="profileView">
        <a href="/" class="back-link">← Назад в чат</a>
        <h2>{{.Name}}</h2>
        <p class="subtitle">@{{.Usertag}}</p>

        <div class="info-card">
            <div class="info-row">
                <span class="info-label">Email</span>
                <span class="info-value">{{.Email}}</span>
            </div>
            <div class="info-row">
                <span class="info-label">Дата регистрации</span>
                <span class="info-value">{{.Ca.Format "02.01.2006"}}</span>
            </div>
        </div>

        <button class="btn btn-primary" onclick="openModal('nameModal')">✏️ Изменить имя</button>
        <button class="btn btn-outline" onclick="openModal('tagModal')">🏷️ Изменить @usertag</button>
        <button class="btn btn-danger" onclick="openModal('passwordModal')">🔒 Сменить пароль</button>
    </div>

    <!-- Модалка: Изменить имя -->
    <div class="modal" id="nameModal">
        <div class="modal-content">
            <h3>Изменить имя</h3>
            <form action="/profile/redact/name" method="POST">
                <label>Новое имя</label>
                <input type="text" name="newname" required value="{{.Name}}" />
                <button type="submit" class="btn btn-primary" style="margin-top:10px;">Сохранить</button>
                <button type="button" class="btn btn-outline" onclick="closeModal('nameModal')">Отмена</button>
            </form>
        </div>
    </div>

    <!-- Модалка: Изменить usertag -->
    <div class="modal" id="tagModal">
        <div class="modal-content">
            <h3>Изменить @usertag</h3>
            <form action="/profile/redact/tag" method="POST">
                <label>Новый @usertag</label>
                <input type="text" name="usertag" required value="{{.Usertag}}" />
                <button type="submit" class="btn btn-primary" style="margin-top:10px;">Сохранить</button>
                <button type="button" class="btn btn-outline" onclick="closeModal('tagModal')">Отмена</button>
            </form>
        </div>
    </div>

    <!-- Модалка: Сменить пароль -->
    <div class="modal" id="passwordModal">
        <div class="modal-content">
            <h3>Сменить пароль</h3>
            <form action="/profile/redact/password" method="POST">
                <label>Новый пароль</label>
                <input type="password" name="newpassword" required />
                <label>Повторите пароль</label>
                <input type="password" name="repeatpassword" required />
                <button type="submit" class="btn btn-primary" style="margin-top:10px;">Сохранить</button>
                <button type="button" class="btn btn-outline" onclick="closeModal('passwordModal')">Отмена</button>
            </form>
        </div>
    </div>

    <script>
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        // Закрытие по клику вне модалки
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', function(e) {
                if (e.target === modal) modal.classList.remove('active');
            });
        });
    </script>
</body>
</html>
